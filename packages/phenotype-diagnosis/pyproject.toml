[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-phenotype-diagnosis"
version = "0.0.1"
description = "Grounded phenotype mapping and evidence-backed differential diagnosis"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiscientist-mcp-common>=0.0.3",
    "jsonschema",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
phenotype-diagnosis-mcp = "aiscientist_mcp.phenotype_diagnosis.server:main"

[tool.uv.sources]
aiscientist-mcp-common = { workspace = true }

[tool.aiscientist-mcp]
# Category of the server; the same names as the skills registry (lijinbio/aiscientist-skills).
category = "annotation"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true

[tool.setuptools.package-data]
"aiscientist_mcp.phenotype_diagnosis" = ["descriptions/*.md"]
"aiscientist_mcp.phenotype_diagnosis.hpo" = ["*.tsv", "*.tsv.gz"]
