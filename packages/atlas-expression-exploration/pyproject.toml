[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-atlas-expression-exploration"
version = "0.0.4"
description = "MCP server: gene expression across the cell types of a single-cell atlas (scanpy)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["aiscientist-mcp-common>=0.0.2", "scanpy>=1.12", "anndata>=0.12", "h5py", "pandas", "numpy",
                "scipy", "matplotlib", "pyarrow"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
atlas-expression-exploration-mcp = "aiscientist_mcp.atlas_expression_exploration.server:main"

[tool.uv.sources]
aiscientist-mcp-common = { workspace = true }

[tool.aiscientist-mcp]
# Category of the server; the same names as the skills registry (lijinbio/aiscientist-skills).
category = "single-cell"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true
