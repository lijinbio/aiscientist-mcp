[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-data-utilities"
version = "0.0.1"
description = "Bounded dataset inspection and deterministic Graphviz schematics"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiscientist-mcp-common>=0.0.3", "h5py>=3.11", "pydot>=3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
data-utilities-mcp = "aiscientist_mcp.data_utilities.server:main"

[tool.uv.sources]
aiscientist-mcp-common = { workspace = true }

[tool.aiscientist-mcp]
# Category of the server; the same names as the skills registry (lijinbio/aiscientist-skills).
category = "utilities"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true

[tool.setuptools.package-data]
"aiscientist_mcp.data_utilities" = ["provenance.json"]
