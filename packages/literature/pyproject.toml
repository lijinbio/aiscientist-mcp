[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-literature"
version = "0.0.4"
description = "MCP server: biomedical literature retrieval and grounded corpus analysis"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiscientist-mcp-common>=0.0.4",
    "httpx2",
    "jsonschema",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]
full = [
    "paper-qa[local,pymupdf]==2026.3.18",
    "pymupdf",
    "sentence-transformers",
]

[project.scripts]
literature-mcp = "aiscientist_mcp.literature.server:main"

[tool.uv.sources]
aiscientist-mcp-common = { workspace = true }

[tool.aiscientist-mcp]
# Category of the server; the same names as the skills registry (lijinbio/aiscientist-skills).
category = "literature"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true

[tool.setuptools.package-data]
"aiscientist_mcp.literature" = ["descriptions/*.md"]
