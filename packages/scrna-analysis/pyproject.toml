[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-scrna-analysis"
version = "0.0.2"
description = "Single-cell RNA analysis with reproducible QC, clustering, differential expression and annotation"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "aiscientist-mcp-common>=0.0.3", "jsonschema>=4.18",
  "scanpy>=1.10", "anndata>=0.10", "gseapy>=1.1", "pydeseq2>=0.4",
  "matplotlib>=3.8", "pandas>=2.0", "leidenalg>=0.10", "harmonypy==0.0.10", "scikit-image>=0.22",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
scrna-analysis-mcp = "aiscientist_mcp.scrna_analysis.server:main"

[tool.uv.sources]
aiscientist-mcp-common = { workspace = true }

[tool.aiscientist-mcp]
# Category of the server; the same names as the skills registry (lijinbio/aiscientist-skills).
category = "single-cell"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true

[tool.setuptools.package-data]
"aiscientist_mcp.scrna_analysis" = ["tool_specs.json", "provenance.json", "run_marker_annotation/references/*.json"]
