[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-visionkb-kg"
version = "0.0.1"
description = "MCP server: VisionKB knowledge graph (read-only queries with evidence)"
requires-python = ">=3.11"
license = "MIT"
# HTTP with the standard library (urllib); pydantic (already required by mcp) for argument constraints.
dependencies = ["aiscientist-mcp-common>=0.0.2", "pydantic>=2.14.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
visionkb-kg-mcp = "aiscientist_mcp.visionkb_kg.server:main"

[tool.uv.sources]
aiscientist-mcp-common = { workspace = true }

[tool.aiscientist-mcp]
# Category of the server; the same names as the skills registry (lijinbio/aiscientist-skills).
category = "knowledge-graph"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true
