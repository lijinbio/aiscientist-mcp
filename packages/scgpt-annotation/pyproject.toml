[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-scgpt-annotation"
version = "0.0.1"
description = "GPU reference-based single-cell annotation using the validated scGPT harness"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiscientist-mcp-common>=0.0.3"]

[project.optional-dependencies]
test = ["pytest", "anndata>=0.10", "pandas>=2"]

[project.scripts]
scgpt-annotation-mcp = "aiscientist_mcp.scgpt_annotation.server:main"

[tool.uv.sources]
aiscientist-mcp-common = { workspace = true }

[tool.aiscientist-mcp]
# Category of the server; the same names as the skills registry (lijinbio/aiscientist-skills).
category = "single-cell"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true

[tool.setuptools.package-data]
"aiscientist_mcp.scgpt_annotation" = ["provenance.json"]
