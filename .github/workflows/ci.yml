name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-packages
      - name: servers.json and README catalog up to date
        run: uv run python scripts/index_servers.py --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-packages
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - name: Audit dependencies
        run: |
          uv export --locked --all-packages --no-emit-workspace > requirements-audit.txt
          uvx pip-audit --strict --disable-pip -r requirements-audit.txt

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-packages
      - run: uv run pytest

  install:
    # Users install with pip or conda, not uv: check that route from a clean interpreter.
    name: Install with pip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./packages/common ./packages/atlas-expression-exploration ./packages/visionkb-kg
      - run: aiscientist-mcp --server atlas-expression-exploration-mcp tools | python -c 'import json, sys; assert len(json.load(sys.stdin)) == 9'
      - run: aiscientist-mcp --server visionkb-kg-mcp tools | python -c 'import json, sys; assert len(json.load(sys.stdin)) == 8'

  container:
    name: Container (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [atlas-expression-exploration, visionkb-kg]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/${{ matrix.server }}/Dockerfile
          push: false
          tags: mcp-${{ matrix.server }}:ci
          load: true
      - run: docker run --rm mcp-${{ matrix.server }}:ci aiscientist-mcp --server ${{ matrix.server }}-mcp tools | python3 -c 'import json, sys; assert json.load(sys.stdin)'
