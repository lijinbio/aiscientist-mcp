name: Release

on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: tag
        name: Package and version from the tag
        run: |
          t="${GITHUB_REF_NAME}"; pkg="${t%-v*}"; ver="${t##*-v}"
          [[ -d "packages/$pkg" ]] || { echo "no package packages/$pkg"; exit 1; }
          want=$(python3 -c "import tomllib; print(tomllib.load(open('packages/$pkg/pyproject.toml','rb'))['project']['version'])")
          [[ "$ver" == "$want" ]] || { echo "tag $t != packages/$pkg version $want"; exit 1; }
          echo "package=$pkg" >> "$GITHUB_OUTPUT"; echo "version=$ver" >> "$GITHUB_OUTPUT"
          [[ -f "containers/$pkg/Dockerfile" ]] && echo "image=true" >> "$GITHUB_OUTPUT" || echo "image=false" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-packages
      - run: uv run pytest packages/${{ steps.tag.outputs.package }}
      - if: steps.tag.outputs.image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.tag.outputs.image == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/${{ steps.tag.outputs.package }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mcp-${{ steps.tag.outputs.package }}:${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          notes="Package \`${{ steps.tag.outputs.package }}\` ${{ steps.tag.outputs.version }}."
          if [[ "${{ steps.tag.outputs.image }}" == "true" ]]; then
            img="ghcr.io/${{ github.repository_owner }}/mcp-${{ steps.tag.outputs.package }}"
            notes="$notes"$'\n\n'"Image: \`$img:${{ steps.tag.outputs.version }}\`"$'\n'"Digest: \`$img@${{ steps.push.outputs.digest }}\`"
          fi
          options=()
          if [[ "$IS_FORK" == "true" ]]; then
            options+=(--prerelease)
            notes=$'Fork validation prerelease. Upstream review and deployment acceptance are separate gates.\n\n'"$notes"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes "${options[@]}"
